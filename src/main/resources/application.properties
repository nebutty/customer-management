spring.application.name=customer-management

# Server configuration
server.port=${SERVER_PORT:8080}


# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/training_db}
spring.datasource.username=${DB_USERNAME:customer_app}
spring.datasource.password=${DB_PASSWORD}



# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/training_db}
spring.flyway.user=${DB_MIGRATION_USERNAME:postgres_admin}
spring.flyway.password=${DB_MIGRATION_PASSWORD}

# Database configuration (used when database support is configured)


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Application logging
logging.level.com.example.customer_management=DEBUG
# Structured JSON logging
logging.structured.format.console=logstash
logging.structured.json.add.mdc.correlationId=correlationId



spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/customer-management

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://customer-keycloak:8080/realms/customer-management/protocol/openid-connect/certs